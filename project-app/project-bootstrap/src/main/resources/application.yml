server:
  port: 8080

spring:
  application:
    name: enterprise-app
  
  # H2 In-Memory Veritabanı Ayarları
  datasource:
    url: jdbc:h2:mem:enterprisedb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  
  # H2 Web Konsolunu Aktifleştirme (Tarayıcıdan DB'yi görmek için)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA ve Hibernate Ayarları
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update # Uygulama kalkarken tabloları otomatik oluşturur
    show-sql: true     # Arka planda atılan (Join vb.) SQL sorgularını konsolda gösterir

# Loglama Ayarları (Kök hizada olmalı)
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"