name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  enterprise-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Enterprise App
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  notification-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-notification
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Notification App
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
