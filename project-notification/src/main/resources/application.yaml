server:
  port: 8081

spring:
  application:
    name: notification
  datasource:
    url: jdbc:h2:mem:notificationdb # completely independent database
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console